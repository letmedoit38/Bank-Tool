name: Test GST Portal API

on:
  push:
    branches:
      - claude/beautiful-wright-yyp9yj
    paths:
      - '.github/workflows/test_gst_api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test GST Search API - GET
        run: |
          echo "=== TEST 1: GET search by pincode 400001 ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://services.gst.gov.in/services/api/search/taxpayerSearch?pinCode=400001&typeCode=2" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://services.gst.gov.in/services/searchtp" \
            -H "Origin: https://services.gst.gov.in"
          echo ""

      - name: Test GST Search API - POST
        run: |
          echo "=== TEST 2: POST search by pincode 400001 ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://services.gst.gov.in/services/api/search/taxpayerSearch" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://services.gst.gov.in/services/searchtp" \
            -H "Origin: https://services.gst.gov.in" \
            -d '{"gstin":"","tradeName":"","pinCode":"400001","stateCode":"","legalName":"","taxPayerType":"","typeCode":2}'
          echo ""

      - name: Test GST Detail - GET
        run: |
          echo "=== TEST 3: GET GSTIN detail 27AAPFU0939F1ZV ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://services.gst.gov.in/services/api/search/taxpayerDetails?gstin=27AAPFU0939F1ZV" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            -H "Referer: https://services.gst.gov.in/services/searchtp"
          echo ""

      - name: Test GST Detail - POST
        run: |
          echo "=== TEST 4: POST GSTIN detail 27AAPFU0939F1ZV ==="
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://services.gst.gov.in/services/api/search/taxpayerDetails" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            -H "Referer: https://services.gst.gov.in/services/searchtp" \
            -d '{"gstin":"27AAPFU0939F1ZV"}'
          echo ""

      - name: Test GST with session cookie approach
        run: |
          echo "=== TEST 5: First get session then search ==="
          COOKIE=$(curl -s -c - "https://services.gst.gov.in/services/searchtp" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" | grep -o 'JSESSIONID=[^;]*' | head -1)
          echo "Cookie: $COOKIE"
          curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://services.gst.gov.in/services/api/search/taxpayerSearch" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            -H "Referer: https://services.gst.gov.in/services/searchtp" \
            -H "Cookie: $COOKIE" \
            -d '{"gstin":"","tradeName":"","pinCode":"400001","stateCode":"","legalName":"","taxPayerType":"","typeCode":2}'
          echo ""
